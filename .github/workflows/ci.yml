name: CI - Cross-Platform Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up MSYS2 MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Install Lean 4 via elan (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain $(cat lean-toolchain)
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Lean 4 via elan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\elan.zip"
          Expand-Archive "$env:TEMP\elan.zip" -DestinationPath "$env:TEMP\elan-setup" -Force
          $tc = (Get-Content lean-toolchain).Trim()
          & "$env:TEMP\elan-setup\elan-init.exe" -y --default-toolchain $tc
          "$env:USERPROFILE\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Lean & Lake
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          lean --print-prefix

      - name: Compile native core
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd python
          python build_native.py --no-lake

      - name: Verify compiled binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./python/qrig/_bin/qrig-core.exe version
          else
            ./python/qrig/_bin/qrig-core version
          fi

      - name: Install dependencies and package
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e "./python[test]"

      - name: Run test suite
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd python
          python -m pytest -v tests
