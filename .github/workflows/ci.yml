name: CI - Cross-Platform Test & Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # Test Python 3.9 and 3.13 on Ubuntu and Windows
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Lean 4
        uses: leanprover/action-elan@v1

      - name: Set up MSYS2 MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Compile native core
        shell: bash
        run: |
          cd python
          python build_native.py --no-lake

      - name: Verify compiled binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./python/qrig/_bin/qrig-core.exe version
          else
            ./python/qrig/_bin/qrig-core version
          fi

      - name: Install dependencies and package
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e "./python[test]"

      - name: Run test suite
        shell: bash
        run: |
          cd python
          python -m pytest -v tests
