name: Release - Build Wheels & Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Target repository to publish to"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
      dry_run:
        description: "Dry run (build and test only, do not upload)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  build-wheels:
    name: Build wheel on ${{ matrix.os }} (${{ matrix.platform_tag }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_tag: manylinux2014_x86_64
          - os: macos-13
            platform_tag: macosx_10_9_x86_64
          - os: macos-14
            platform_tag: macosx_11_0_arm64
          - os: windows-latest
            platform_tag: win_amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Lean 4
        uses: leanprover/action-elan@v1

      - name: Set up MSYS2 MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Compile native core
        shell: bash
        run: |
          cd python
          python build_native.py --no-lake

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build --wheel --outdir dist ./python

      - name: Rename wheel if needed to match platform tag
        shell: bash
        run: |
          ls -la dist/
          # Verify wheel exists
          WHEEL=$(ls dist/*.whl)
          echo "Built wheel: $WHEEL"

      - name: Smoke test installed wheel
        shell: bash
        run: |
          python -m venv test_env
          if [ "${{ runner.os }}" = "Windows" ]; then
            source test_env/Scripts/activate
          else
            source test_env/bin/activate
          fi
          pip install dist/*.whl
          python -c "import qrig; print('qrig smoke test OK, version:', qrig.version())"
          python -c "import qrig; from qrig import X, C1; print('circuit check:', qrig.check(C1(X)))"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform_tag }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist ./python

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI / TestPyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist-merged
          merge-multiple: true

      - name: Display files to be published
        run: |
          ls -lah dist-merged/

      - name: Determine publish target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.target }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> $GITHUB_OUTPUT
          else
            # For tag pushes:
            # Tags containing 'rc', 'dev', 'alpha', 'beta', or 'test' go to TestPyPI
            TAG="${{ github.ref_name }}"
            if echo "$TAG" | grep -Ei "rc|dev|alpha|beta|test"; then
              echo "target=testpypi" >> $GITHUB_OUTPUT
            else
              echo "target=pypi" >> $GITHUB_OUTPUT
            fi
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to TestPyPI
        if: steps.target.outputs.dry_run == 'false' && steps.target.outputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-merged/
          skip-existing: true
          # Works with PyPI Trusted Publishing or API token stored in secrets
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Publish to PyPI
        if: steps.target.outputs.dry_run == 'false' && steps.target.outputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-merged/
          skip-existing: true
          # Works with PyPI Trusted Publishing or API token stored in secrets
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.target.outputs.dry_run == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-merged/*
          generate_release_notes: true
