name: Release - Build Wheels & Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Target repository to publish to"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: write
  id-token: write

jobs:
  build-wheels:
    name: Build wheel on ${{ matrix.os }} (${{ matrix.platform_tag }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_tag: manylinux2014_x86_64
          - os: macos-14
            platform_tag: macosx_11_0_arm64
          - os: windows-latest
            platform_tag: win_amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MSYS2 MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Install Lean 4 via elan (Linux & macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain $(cat lean-toolchain)
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Lean 4 via elan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\elan.zip"
          Expand-Archive "$env:TEMP\elan.zip" -DestinationPath "$env:TEMP\elan-setup" -Force
          $tc = (Get-Content lean-toolchain).Trim()
          & "$env:TEMP\elan-setup\elan-init.exe" -y --default-toolchain $tc
          "$env:USERPROFILE\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile native core
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cd python
          python build_native.py --no-lake

      - name: Build wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build --wheel --outdir dist ./python

      - name: Rename wheel if needed to match platform tag
        shell: bash
        run: |
          ls -la dist/
          # Verify wheel exists
          WHEEL=$(ls dist/*.whl)
          echo "Built wheel: $WHEEL"

      - name: Smoke test installed wheel
        shell: bash
        run: |
          python -m venv test_env
          if [ "${{ runner.os }}" = "Windows" ]; then
            source test_env/Scripts/activate
          else
            source test_env/bin/activate
          fi
          pip install dist/*.whl
          python -c "import qrig; print('qrig smoke test OK, version:', qrig.version())"
          python -c "import qrig; from qrig import X, C1; print('circuit check:', qrig.check(C1(X)))"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform_tag }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir dist ./python

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI / TestPyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    env:
      TEST_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist-merged
          merge-multiple: true

      - name: Display files to be published
        run: |
          ls -lah dist-merged/

      # TestPyPI via API Token
      - name: Publish to TestPyPI (Token)
        if: ((github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') || (github.event_name == 'push' && contains(github.ref_name, 'rc'))) && env.TEST_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-merged/
          skip-existing: true
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      # TestPyPI via Trusted Publishing (OIDC)
      - name: Publish to TestPyPI (OIDC)
        if: ((github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') || (github.event_name == 'push' && contains(github.ref_name, 'rc'))) && env.TEST_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-merged/
          skip-existing: true

      # Production PyPI via API Token
      - name: Publish to PyPI (Token)
        if: ((github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc'))) && env.PYPI_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-merged/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

      # Production PyPI via Trusted Publishing (OIDC)
      - name: Publish to PyPI (OIDC)
        if: ((github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc'))) && env.PYPI_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-merged/
          skip-existing: true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-merged/*
          generate_release_notes: true
