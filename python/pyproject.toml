[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrig"
version = "1.1.0"
description = "Verified controlled quantum circuits (\"One rig to control them all\"): exact semantics, control equations, Gray-code synthesis and optimisation, with a C core extracted from Lean 4"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "Shashi Kumar"}
]
maintainers = [
    {name = "Shashi Kumar"}
]
keywords = [
    "quantum",
    "quantum-computing",
    "circuit-optimization",
    "qiskit",
    "formal-verification",
    "lean4",
    "control-equations"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = ["numpy"]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
test = ["pytest", "qiskit>=1.0"]
mqt = ["qiskit>=1.0", "mqt.bench", "mqt.qcec"]
noise = ["qiskit>=1.0", "qiskit-aer", "qiskit-ibm-runtime", "mqt.bench", "matplotlib"]

[project.urls]
Homepage = "https://github.com/qrig-project/qrig"
Repository = "https://github.com/qrig-project/qrig"
Documentation = "https://github.com/qrig-project/qrig#readme"

[tool.setuptools]
packages = ["qrig"]

[tool.setuptools.package-data]
qrig = ["_bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
